[package]
name = "naves-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
naves-formats = { path = "../crates/naves-formats" }
naves-core = { path = "../crates/naves-core" }

