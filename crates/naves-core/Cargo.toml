[package]
name = "naves-core"
description = "Náves: naves-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.0"
unicode-normalization = "0.1.26"
tempfile = "3.27.0"
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
proj4rs = "0.3.0"
rayon = "1.12.0"

[features]
# Test-only constructors (Dem::from_fn); used by the tests of the other crates too.
test-util = []

[dev-dependencies]
naves-core = { path = ".", features = ["test-util"] }
