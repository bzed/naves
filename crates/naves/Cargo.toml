[package]
name = "naves"
description = "Náves – terrain generator and map editor for DayZ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
naves-core = { version = "0.1.0", path = "../naves-core" }
naves-export = { version = "0.1.0", path = "../naves-export" }
naves-ui = { version = "0.2.0", path = "../naves-ui" }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
naves-export = { path = "../naves-export", features = ["test-util"] }
egui_kittest = "0.37.0"
rmcp = { version = "3.8.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.54.1", features = ["process"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
proptest = "1.12.0"
