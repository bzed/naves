[package]
name = "naves-ui"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Rerun's re_ui design system, vendored into Náves via rerun_ui_kit (re_ui 0.42.0 base, https://github.com/jiangheng90-opensource/rerun_ui_kit), without the rerun data stack"
repository = "https://github.com/bzed/naves"
readme = "README.md"
keywords = ["egui", "rerun", "ui", "widgets"]
categories = ["gui"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0"
crossbeam = "0.8"
egui = { version = "0.37", features = ["color-hex", "experimental"] }
egui_commonmark = "0.26"
egui_extras = { version = "0.37", features = ["image", "svg"] }
itertools = "0.15"
jiff = "0.2"
log = "0.4"
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
num-traits = "0.2"
parking_lot = "0.12"
ron = { version = "0.12", features = ["integer128"] }
serde = { version = "1.0", features = ["derive"] }
smallvec = { version = "1.15", features = ["const_generics", "union"] }
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
url = "2.5"
web-time = "1.1"

[dev-dependencies]
crossbeam = "0.8"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_kittest = { version = "0.37", features = ["snapshot"] }
egui_tiles = "0.18"
log = "0.4"
