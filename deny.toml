[graph]
all-features = true

[advisories]
yanked = "warn"
# RUSTSEC-2026-0192 (ttf-parser unmaintained): arrives with winit 0.30's `sctk-adwaita` (the Wayland
# window decorations) through eframe; it is unmaintained, not a vulnerability, and nothing we select
# — the fix belongs to winit. Revisit when eframe moves to a winit without it.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CC0-1.0",
    "LGPL-2.1-or-later", "LGPL-3.0", "GPL-3.0-or-later", "AGPL-3.0-or-later", "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The fonts that egui embeds (Hack, Ubuntu-Light, NotoEmoji, emoji-icon-font). Font licences cover the font
# files only; they allow shipping them inside a program. Scoped to this crate, not allowed globally.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# The Inter font that the vendored design system (naves-ui) embeds. The SIL Open Font License covers
# the font file only; it allows shipping it inside a program. Scoped to this crate, not allowed globally.
[[licenses.exceptions]]
crate = "naves-ui"
allow = ["OFL-1.1"]

# The Mozilla CA list that the HTTP client (ureq with rustls) trusts. CDLA-Permissive-2.0 is a permissive data
# licence: it allows using and redistributing the list in a program. Scoped to this crate, not allowed globally.
# A CA can be revoked, so `make ca-bundle` (CI, weekly and at every release) fails when a newer release exists.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]
